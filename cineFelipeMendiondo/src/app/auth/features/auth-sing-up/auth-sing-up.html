<section class="auth-page">
  <div class="auth-container">

    <a href="#" class="auth-logo">
      <img src="https://flowbite.s3.amazonaws.com/blocks/marketing-ui/logo.svg" alt="logo">
      Flowbite
    </a>

    <div class="auth-card">
      <div class="auth-card-body">

        <h1 class="auth-title">Create una cuenta</h1>

        <form class="auth-form" action="#">

          <div class="form-group">
            <label for="email">Tu email</label>
            <input type="email" name="email" id="email" placeholder="name@company.com" required>
          </div>

          <div class="form-group">
            <label for="Contraseña">Contraseña</label>
            <input type="Contraseña" name="Contraseña" id="Contraseña" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="contraseña" name="confirm-contraseña" id="confirm-contraseña" placeholder="••••••••" required>
          </div>

          <div class="form-check">
            <input id="terms" type="checkbox" required>
            <label for="terms">Acepto los <a href="#">Terminos y condiciones</a></label>
          </div>

          <button type="submit" class="btn-primary">Create an account</button>

          <p class="auth-footer">
            Already have an account? <a href="#">Login
